services:
  ultrasinger:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      # Create input/ and output/ in the project root before the first run.
      # A missing folder is an error here instead of being created by the
      # container engine as root, which the container (user ID 1000) could
      # not write to. Put cookies.txt into input/ when you need one.
      - type: bind
        source: ../input
        target: /app/UltraSinger/input
        bind:
          create_host_path: false
      - type: bind
        source: ../output
        target: /app/UltraSinger/output
        bind:
          create_host_path: false
      # Downloaded models, kept between runs
      - model-cache:/home/ultrasinger/.cache
    stdin_open: true
    tty: true

volumes:
  model-cache:
